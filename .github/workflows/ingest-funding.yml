name: Ingest funding news

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours, off the top of the hour
  workflow_dispatch: {}

concurrency:
  group: ingest-funding
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest:funding
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FUNDING_FEEDS: ${{ vars.FUNDING_FEEDS }}
